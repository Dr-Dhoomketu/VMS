kind = "web"
previewPath = "/"
title = "VisitorPass - Visitor Management System"
version = "1.0.0"
id = "artifacts/visitor-pass"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25678

[services.development]
run = "pnpm --filter @workspace/visitor-pass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/visitor-pass", "run", "build" ]
publicDir = "artifacts/visitor-pass/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25678"
BASE_PATH = "/"
